services:
  db:
    image: postgres:16-alpine
    container_name: kmct-superadmin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kmct_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - kmct_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kmct_erp"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    container_name: kmct-superadmin-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/kmct_erp
      JWT_SECRET: ${JWT_SECRET:-replace-this-before-deployment}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-admin}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@kmct.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-ChangeMe123!}
      FINANCE_USERNAME: ${FINANCE_USERNAME:-finance}
      FINANCE_EMAIL: ${FINANCE_EMAIL:-finance@kmct.local}
      FINANCE_PASSWORD: ${FINANCE_PASSWORD:-Finance123!}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: kmct-superadmin-web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  kmct_pgdata:
